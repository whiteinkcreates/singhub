name: Refresh canonical data branch

on:
  push:
    branches:
      - fix/data-integrity-guardrails
    paths:
      - ".github/workflows/refresh-canonical-data-branch.yml"
      - "scripts/**"
      - "config/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  BRANCH: fix/data-integrity-guardrails

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enforce canonical freshness
        env:
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
        run: node scripts/check-canonical-freshness.mjs

      - name: Refresh public snapshot from canonical source
        env:
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
        run: npm run sync:data -- --write --no-backup

      - name: Validate application
        run: |
          npm run lint
          npm run build

      - name: Show data delta
        run: git diff --check && git diff --stat && git diff -- public/data

      - name: Commit refreshed public data
        run: |
          if git diff --quiet -- public/data; then
            echo "No public data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "data: refresh public snapshot from canonical source"
          git push origin HEAD:${{ env.BRANCH }}

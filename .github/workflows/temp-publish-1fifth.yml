name: Publish #1 Fifth public data

on:
  push:
    branches:
      - sync-1fifth-public-data-v2
    paths:
      - ".github/workflows/temp-publish-1fifth.yml"
      - ".github/sync-1fifth-publish-trigger.txt"

permissions:
  contents: write

jobs:
  patch-public-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: sync-1fifth-public-data-v2

      - name: Patch #1 Fifth rows only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          venue = base64.b64decode('').decode()
          thursday = base64.b64decode('').decode()
          tuesday = base64.b64decode('').decode()

          vp = Path('public/data/venues.tsv')
          lines = vp.read_text().splitlines()
          found = False
          for i, line in enumerate(lines):
              if line.startswith('venue-0051\t'):
                  lines[i] = venue
                  found = True
                  break
          if not found:
              raise SystemExit('venue-0051 not found in venues.tsv')
          vp.write_text('\n'.join(lines) + '\n')

          ep = Path('public/data/events_by_night.tsv')
          lines = ep.read_text().splitlines()
          replacements = {
              'weekly-1-fifth-avenue-thursday\t': thursday,
              'weekly-1-fifth-avenue-tuesday\t': tuesday,
          }
          seen = set()
          for i, line in enumerate(lines):
              for prefix, replacement in replacements.items():
                  if line.startswith(prefix):
                      lines[i] = replacement
                      seen.add(prefix)
                      break
          if 'weekly-1-fifth-avenue-thursday\t' not in seen:
              raise SystemExit('Thursday #1 Fifth event not found')
          if 'weekly-1-fifth-avenue-tuesday\t' not in seen:
              lines.append(tuesday)
          ep.write_text('\n'.join(lines) + '\n')
          PY

      - name: Commit patched public data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/venues.tsv public/data/events_by_night.tsv
          if git diff --cached --quiet; then
            echo "No public data changes needed."
            exit 0
          fi
          git commit -m "Publish verified #1 Fifth karaoke schedule"
          git push origin HEAD:sync-1fifth-public-data-v2

name: Sync public karaoke data

on:
  # The canonical Google Sheet is the operational source of truth.
  # Poll the canonical sheet every two hours with a lightweight preflight.
  # The full sync only runs when that preflight detects a public-data change,
  # so unchanged checks do not create commits, deployments, or Vercel usage.
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-public-data.yml"
      - "package.json"
      - "config/data-sources.json"
      - "config/approved-live-only-removals.json"
      - "config/approved-venue-identity-changes.json"
      - "config/public-data-thresholds.json"
      - "config/location-taxonomy.json"
      - "scripts/check-public-data.mjs"
      - "scripts/check-canonical-sync-needed.mjs"
      - "scripts/google-sheets-api.mjs"
      - "scripts/sync-public-data.mjs"
      - "scripts/sync-public-data-with-taxonomy.mjs"
  pull_request:
    paths:
      - ".github/workflows/sync-public-data.yml"
      - "package.json"
      - "config/data-sources.json"
      - "config/approved-live-only-removals.json"
      - "config/public-data-thresholds.json"
      - "config/location-taxonomy.json"
      - "scripts/check-public-data.mjs"
      - "scripts/check-canonical-sync-needed.mjs"
      - "scripts/google-sheets-api.mjs"
      - "scripts/sync-public-data.mjs"
      - "scripts/sync-public-data-with-taxonomy.mjs"

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: sync-public-data
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      changed_files: ${{ steps.check.outputs.changed_files }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Decide whether a full sync is needed
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "changed_files=forced_by_$EVENT_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          node scripts/check-canonical-sync-needed.mjs

  dry-run:
    needs: preflight
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate and validate candidate data
        env:
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
        run: npm run sync:data -- --dry-run --output-dir .data-sync-output

      - name: Upload candidate data and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: singhub-public-data-candidate
          path: .data-sync-output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: preflight
    if: github.event_name != 'pull_request' && needs.preflight.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate and publish validated data
        env:
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
        run: npm run sync:data -- --write --no-backup --output-dir .data-sync-output

      - name: Validate generated snapshot
        # Keep data publishing independent from unrelated UI lint/build failures.
        # The repository's normal validation workflow owns app-wide code quality;
        # this job's production responsibility is keeping verified karaoke data fresh.
        run: |
          npm run check:data
          npm run test:data

      - name: Create automated data pull request
        id: data_pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- \
            public/data/venues.tsv \
            public/data/events_by_night.tsv \
            public/data/generated_events_review.tsv \
            public/data/venue_slug_aliases.tsv; then
            echo "No public-facing data changes to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add \
            public/data/venues.tsv \
            public/data/events_by_night.tsv \
            public/data/generated_events_review.tsv \
            public/data/venue_slug_aliases.tsv \
            public/data/sync-metadata.json \
            public/data/sync-validation-report.md \
            public/data/sync-diff-report.md

          git status --short

          BRANCH="automation/data-sync-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "$BRANCH"
          git commit -m "data: intentional canonical sync"
          git push -u origin "$BRANCH"

          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "data: intentional canonical sync" \
            --body "Intentional SingHUB canonical-to-public data sync. Data guardrails and committed-data checks passed before this pull request was created.")

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Merge automated data pull request
        if: steps.data_pr.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ steps.data_pr.outputs.pr_url }}" \
            --squash \
            --delete-branch

      - name: Run integrity audit against merged snapshot
        if: steps.data_pr.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run data-integrity-audit.yml --ref main

      - name: Upload sync artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: singhub-public-data-sync
          path: .data-sync-output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

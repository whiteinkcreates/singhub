name: Sync public karaoke data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 10 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-public-data.yml"
  pull_request:
    paths:
      - ".github/workflows/sync-public-data.yml"
      - "package.json"
      - "config/data-sources.json"
      - "config/public-data-thresholds.json"
      - "config/location-taxonomy.json"
      - "scripts/check-public-data.mjs"
      - "scripts/google-sheets-api.mjs"
      - "scripts/sync-public-data.mjs"
      - "scripts/sync-public-data-with-taxonomy.mjs"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-public-data
  cancel-in-progress: false

jobs:
  dry-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate and validate candidate data
        env:
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
        run: npm run sync:data -- --dry-run --output-dir .data-sync-output

      - name: Upload candidate data and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: singhub-public-data-candidate
          path: .data-sync-output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate and publish validated data
        env:
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
        run: npm run sync:data -- --write --no-backup --output-dir .data-sync-output

      - name: Validate generated snapshot
        run: |
          npm run check:data
          npm run lint
          npm run build

      - name: Create automated data pull request
        id: data_pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            public/data/venues.tsv \
            public/data/events_by_night.tsv \
            public/data/generated_events_review.tsv \
            public/data/venue_slug_aliases.tsv \
            public/data/sync-metadata.json \
            public/data/sync-validation-report.md \
            public/data/sync-diff-report.md

          git status --short

          if git diff --cached --quiet; then
            echo "No public data changes to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BRANCH="automation/data-sync-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "$BRANCH"
          git commit -m "data: nightly canonical sync"
          git push -u origin "$BRANCH"

          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "data: nightly canonical sync" \
            --body "Automated SingHUB canonical-to-public data sync. Data guardrails, committed-data checks, lint, and build passed before this pull request was created.")

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Merge automated data pull request
        if: steps.data_pr.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ steps.data_pr.outputs.pr_url }}" \
            --squash \
            --delete-branch

      - name: Upload sync artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: singhub-public-data-sync
          path: .data-sync-output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

name: Validate SingHUB

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate committed public data
        run: npm run check:data

      - name: Run listing guardrail regression tests
        run: npm run test:data

      - name: Verify canonical reconciliation and nightlife behavior
        run: node --test tests/canonical-reconciliation.test.mjs tests/nightlife-time.test.mjs tests/launch-qa-regressions.test.mjs tests/hotel-plan-email.test.mjs tests/hotel-analytics.test.mjs tests/image-placement.test.mjs tests/hotel-package.test.mjs tests/hotel-photo-rights.test.mjs

      - name: Verify TourStops and Partner offer redemption
        run: node --test tests/gig-stubs.test.mjs tests/venue-offers.test.mjs tests/venue-checkins.test.mjs

      - name: Prepare isolated My Tour map and song-log UI fixture
        if: startsWith(github.head_ref, 'fix/my-tour-')
        run: node tests/my-tour-ui-browser.mjs --prepare

      - name: Prepare isolated GPS recovery browser fixture
        if: startsWith(github.head_ref, 'fix/gps-checkin-')
        run: node tests/checkin-gps-fallback-browser.mjs --prepare

      - name: Keep heavy media out of deployments
        run: npm run check:assets

      - name: Lint
        run: npm run lint

      - name: Prepare isolated media browser fixture
        if: (startsWith(github.head_ref, 'feat/media-') || startsWith(github.head_ref, 'fix/venue-hero-'))
        run: node tests/image-placement-browser.mjs --prepare

      - name: Prepare isolated star-share browser fixture
        if: startsWith(github.head_ref, 'feat/main-page-')
        run: node tests/star-share-browser.mjs --prepare

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ (startsWith(github.head_ref, 'feat/gig-stubs-') || startsWith(github.head_ref, 'feat/tour-stops')) && 'http://127.0.0.1:3101' || '' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ (startsWith(github.head_ref, 'feat/gig-stubs-') || startsWith(github.head_ref, 'feat/tour-stops')) && 'qa-public-key' || '' }}
        run: npm run build

      - name: Install browser for My Tour mobile QA
        if: startsWith(github.head_ref, 'fix/my-tour-')
        run: npx playwright install --with-deps chromium

      - name: Verify My Tour tile grid, map themes, counter and song CTA
        if: startsWith(github.head_ref, 'fix/my-tour-')
        run: |
          npm run start -- --port 3100 > /tmp/my-tour-qa-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:3100/my-tour-qa > /dev/null; then break; fi
            sleep 1
          done
          node tests/my-tour-ui-browser.mjs

      - name: Save My Tour mobile QA evidence
        if: always() && startsWith(github.head_ref, 'fix/my-tour-')
        uses: actions/upload-artifact@v4
        with:
          name: my-tour-map-and-song-log-qa
          path: .my-tour-qa
          include-hidden-files: true

      - name: Install browser for GPS recovery QA
        if: startsWith(github.head_ref, 'fix/gps-checkin-')
        run: npx playwright install --with-deps chromium

      - name: Verify GPS fallback saves venue visits and Tour Stops
        if: startsWith(github.head_ref, 'fix/gps-checkin-')
        run: |
          npm run start -- --port 3100 > /tmp/gps-qa-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:3100/gps-recovery-qa > /dev/null; then break; fi
            sleep 1
          done
          node tests/checkin-gps-fallback-browser.mjs

      - name: Save GPS recovery QA evidence
        if: always() && startsWith(github.head_ref, 'fix/gps-checkin-')
        uses: actions/upload-artifact@v4
        with:
          name: gps-recovery-browser-qa
          path: .gps-recovery-qa
          include-hidden-files: true

      - name: Install browser for hotel journey QA
        if: startsWith(github.head_ref, 'fix/hotel-')
        run: npx playwright install --with-deps chromium

      - name: Verify hotel desktop and mobile journeys
        if: startsWith(github.head_ref, 'fix/hotel-')
        run: |
          npm run start -- --port 3100 > /tmp/hotel-qa-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:3100 > /dev/null; then break; fi
            sleep 1
          done
          node tests/hotel-journey-browser.mjs

      - name: Save hotel journey QA evidence
        if: always() && startsWith(github.head_ref, 'fix/hotel-')
        uses: actions/upload-artifact@v4
        with:
          name: hotel-journey-qa
          path: .hotel-qa
          include-hidden-files: true

      - name: Install browser for media placement QA
        if: (startsWith(github.head_ref, 'feat/media-') || startsWith(github.head_ref, 'fix/venue-hero-'))
        run: npx playwright install --with-deps chromium

      - name: Verify media placement on desktop and mobile
        if: (startsWith(github.head_ref, 'feat/media-') || startsWith(github.head_ref, 'fix/venue-hero-'))
        run: |
          npm run start -- --port 3100 > /tmp/media-qa-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:3100/media-placement-qa > /dev/null; then break; fi
            sleep 1
          done
          node tests/image-placement-browser.mjs

      - name: Save media placement QA evidence
        if: always() && (startsWith(github.head_ref, 'feat/media-') || startsWith(github.head_ref, 'fix/venue-hero-'))
        uses: actions/upload-artifact@v4
        with:
          name: media-placement-qa
          path: .media-qa
          include-hidden-files: true

      - name: Install browser for main-page hero QA
        if: startsWith(github.head_ref, 'feat/main-page-')
        run: npx playwright install --with-deps chromium

      - name: Verify main-page hero scrolling and layering
        if: startsWith(github.head_ref, 'feat/main-page-')
        run: |
          node tests/main-page-hero-fixture.mjs > /tmp/main-hero-fixture.log 2>&1 &
          fixture_pid=$!
          NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:3101 SUPABASE_SERVICE_ROLE_KEY=isolated-layout-fixture npm run start -- --port 3100 > /tmp/main-hero-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" "$fixture_pid"; cp /tmp/main-hero-server.log .main-hero-qa/server.log' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:3100 > /dev/null; then break; fi
            sleep 1
          done
          node tests/main-page-hero-browser.mjs
          node tests/star-share-browser.mjs

      - name: Save main-page hero QA evidence
        if: always() && startsWith(github.head_ref, 'feat/main-page-')
        uses: actions/upload-artifact@v4
        with:
          name: main-page-hero-qa
          path: .main-hero-qa
          include-hidden-files: true

      - name: Install browser for hotel package QA
        if: startsWith(github.head_ref, 'feat/hotel-package-') || (startsWith(github.head_ref, 'feat/gig-stubs-') || startsWith(github.head_ref, 'feat/tour-stops'))
        run: npx playwright install --with-deps chromium

      - name: Verify hotel package prints and review flow
        if: startsWith(github.head_ref, 'feat/hotel-package-') || (startsWith(github.head_ref, 'feat/gig-stubs-') || startsWith(github.head_ref, 'feat/tour-stops'))
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:3101
          SUPABASE_SERVICE_ROLE_KEY: package-qa-only
          SINGHUB_ADMIN_PASSWORD: package-qa-only
        run: |
          node tests/hotel-package-fixture.mjs > /tmp/hotel-package-fixture.log 2>&1 &
          fixture_pid=$!
          npm run start -- --port 3100 > /tmp/hotel-package-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" "$fixture_pid"; cp /tmp/hotel-package-server.log .hotel-package-qa/server.log' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:3100 > /dev/null; then break; fi
            sleep 1
          done
          node tests/hotel-package-browser.mjs
          if [[ "${{ github.head_ref }}" == feat/gig-stubs-* ]]; then node tests/gig-stubs-browser.mjs; fi

      - name: Save hotel package print evidence
        if: always() && (startsWith(github.head_ref, 'feat/hotel-package-') || (startsWith(github.head_ref, 'feat/gig-stubs-') || startsWith(github.head_ref, 'feat/tour-stops')))
        uses: actions/upload-artifact@v4
        with:
          name: hotel-package-qa
          path: |
            .hotel-package-qa
            !.hotel-package-qa/*.pdf
          include-hidden-files: true

      - name: Save guest elevator PDF
        if: always() && (startsWith(github.head_ref, 'feat/hotel-package-') || (startsWith(github.head_ref, 'feat/gig-stubs-') || startsWith(github.head_ref, 'feat/tour-stops')))
        uses: actions/upload-artifact@v4
        with:
          name: hotel-package-guest-elevator
          path: .hotel-package-qa/*-guest-elevator-INTERNAL.pdf
          include-hidden-files: true

      - name: Save guest desk-tent PDF
        if: always() && (startsWith(github.head_ref, 'feat/hotel-package-') || (startsWith(github.head_ref, 'feat/gig-stubs-') || startsWith(github.head_ref, 'feat/tour-stops')))
        uses: actions/upload-artifact@v4
        with:
          name: hotel-package-guest-desk-tent
          path: .hotel-package-qa/*-guest-desk-tent-INTERNAL.pdf
          include-hidden-files: true

      - name: Save concierge elevator PDF
        if: always() && (startsWith(github.head_ref, 'feat/hotel-package-') || (startsWith(github.head_ref, 'feat/gig-stubs-') || startsWith(github.head_ref, 'feat/tour-stops')))
        uses: actions/upload-artifact@v4
        with:
          name: hotel-package-concierge-elevator
          path: .hotel-package-qa/*-concierge-elevator-INTERNAL.pdf
          include-hidden-files: true

      - name: Save concierge desk-tent PDF
        if: always() && (startsWith(github.head_ref, 'feat/hotel-package-') || (startsWith(github.head_ref, 'feat/gig-stubs-') || startsWith(github.head_ref, 'feat/tour-stops')))
        uses: actions/upload-artifact@v4
        with:
          name: hotel-package-concierge-desk-tent
          path: .hotel-package-qa/*-concierge-desk-tent-INTERNAL.pdf
          include-hidden-files: true

      - name: Save hotel sales sheet PDF
        if: always() && (startsWith(github.head_ref, 'feat/hotel-package-') || (startsWith(github.head_ref, 'feat/gig-stubs-') || startsWith(github.head_ref, 'feat/tour-stops')))
        uses: actions/upload-artifact@v4
        with:
          name: hotel-package-sales-sheet
          path: .hotel-package-qa/*-sales-sheet-INTERNAL.pdf
          include-hidden-files: true

      - name: Save TourStops and band-note browser evidence
        if: always() && (startsWith(github.head_ref, 'feat/gig-stubs-') || startsWith(github.head_ref, 'feat/tour-stops'))
        uses: actions/upload-artifact@v4
        with:
          name: tour-stops-band-notes-qa
          path: .gig-qa
          include-hidden-files: true

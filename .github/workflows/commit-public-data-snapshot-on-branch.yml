name: Commit public data snapshot on branch

on:
  push:
    branches:
      - commit-public-data-snapshot-2026-08-27
    paths:
      - ".github/workflows/commit-public-data-snapshot-on-branch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: commit-public-data-snapshot-2026-08-27

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate validated public data
        env:
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
        run: npm run sync:data -- --write --no-backup --output-dir .data-sync-output

      - name: Commit public data snapshot and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/commit-public-data-snapshot-on-branch.yml
          git add public/data/venues.tsv public/data/events_by_night.tsv public/data/generated_events_review.tsv public/data/venue_slug_aliases.tsv public/data/sync-metadata.json public/data/sync-validation-report.md public/data/sync-diff-report.md
          git status --short
          if git diff --cached --quiet; then
            echo "No public data changes to commit."
          else
            git commit -m "data: publish locked karaoke snapshot"
            git push origin HEAD:commit-public-data-snapshot-2026-08-27
          fi

name: Founding Eight Achievement Contract
on:
  pull_request:
    paths:
      - "src/lib/achievements/**"
      - "src/app/api/achievements/**"
      - "src/app/api/admin/achievements/**"
      - "src/app/nominate/**"
      - "supabase/achievements-founding-eight.sql"
      - "tests/achievement-contract.test.mjs"
      - "tests/achievement-scope.test.mjs"
      - ".github/workflows/achievement-contract.yml"
  push:
    branches:
      - "feat/achievements-founding-eight-pilot"
jobs:
  contract:
    name: Achievement catalog and nomination safeguards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/achievement-contract.test.mjs tests/achievement-scope.test.mjs
